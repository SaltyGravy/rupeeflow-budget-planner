server.port=8080

# ===================================================================
# Database Configuration (Default: H2 File-based persistent DB)
# ===================================================================
spring.datasource.url=jdbc:h2:file:./data/budgetplanner;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===================================================================
# Optional: To switch to MySQL, uncomment below and comment H2 lines:
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/budget_planner?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Spring MVC static resources
spring.web.resources.static-locations=classpath:/static/
